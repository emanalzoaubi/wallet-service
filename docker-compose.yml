services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wallet-service-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - wallet-network
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8.0
    container_name: wallet-service-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wallet_service}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-wallet_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  wallet-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
